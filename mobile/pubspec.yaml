name: rentilly_mobile
description: "Rentilly Mobile App - Zero-Agent Nigerian Real Estate Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.0
  local_auth: ^2.3.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  onesignal_flutter: ^5.2.9
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
