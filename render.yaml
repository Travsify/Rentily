services:
  - type: web
    name: rentilly-admin-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PREMBLY_API_KEY
        sync: false
      - key: IDENTITYPASS_API_KEY
        sync: false
      - key: IDENTITYPASS_APP_ID
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
